[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-runner-desktop"
version = "1.5.5"
description = "A small Tkinter mouse and keyboard automation app"
requires-python = ">=3.9"
dependencies = ["pyautogui>=0.9.54", "pynput>=1.7.7", "Pillow>=9"]

[project.scripts]
macro-runner = "macro_runner:main"

[tool.setuptools]
py-modules = ["macro_runner", "macro_model"]
