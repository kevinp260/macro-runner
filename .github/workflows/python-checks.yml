name: Python checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Compile Python sources
        run: python -m compileall -q macro_runner.py macro_model.py macro_playback.py macro_flow.py macro_vision.py macro_keys.py macro_editing.py macro_runtime.py macro_workflow.py macro_qt.py macro_qt_workflow.py macro_qt_properties.py macro_qt_region.py macro_qt_monitor.py macro_diagnostics.py macro_qt_history.py macro_preflight.py macro_qt_preflight.py macro_recovery.py macro_windows.py macro_qt_windows.py macro_clipboard.py macro_qt_clipboard.py macro_launch.py macro_version.py
      - name: Verify built wheel includes all runtime modules
        run: |
          python -m pip wheel --no-deps --wheel-dir wheelhouse .
          python -c "from pathlib import Path; import zipfile; w=next(Path('wheelhouse').glob('*.whl')); names=set(zipfile.ZipFile(w).namelist()); assert {'macro_runner.py', 'macro_model.py', 'macro_playback.py', 'macro_flow.py', 'macro_vision.py', 'macro_keys.py', 'macro_editing.py', 'macro_runtime.py', 'macro_workflow.py', 'macro_qt.py', 'macro_qt_workflow.py', 'macro_qt_properties.py', 'macro_qt_region.py', 'macro_qt_monitor.py', 'macro_diagnostics.py', 'macro_qt_history.py', 'macro_preflight.py', 'macro_qt_preflight.py', 'macro_recovery.py', 'macro_windows.py', 'macro_qt_windows.py', 'macro_clipboard.py', 'macro_qt_clipboard.py', 'macro_launch.py', 'macro_version.py', 'macro_ui_assets/__init__.py', 'macro_ui_assets/chevron-up-dark.svg', 'macro_ui_assets/chevron-down-dark.svg', 'macro_ui_assets/chevron-up-light.svg', 'macro_ui_assets/chevron-down-light.svg'} <= names"
      - name: Install vision test dependencies
        run: python -m pip install pillow opencv-python-headless PySide6
      - name: Run pure-model tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
