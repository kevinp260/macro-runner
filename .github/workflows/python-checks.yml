name: Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q macro_runner.py macro_model.py macro_playback.py
      - name: Verify built wheel includes all runtime modules
        run: |
          python -m pip wheel --no-deps --wheel-dir wheelhouse .
          python -c "from pathlib import Path; import zipfile; w=next(Path('wheelhouse').glob('*.whl')); names=set(zipfile.ZipFile(w).namelist()); assert {'macro_runner.py', 'macro_model.py', 'macro_playback.py'} <= names"
      - name: Run pure-model tests
        run: python -m unittest discover -s tests -v
