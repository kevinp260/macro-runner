name: Build desktop installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xvfb libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 scrot
          python -m pip install -e . pyinstaller
      - name: Build Ubuntu installer
        run: |
          python -m PyInstaller --clean --noconfirm MacroRunner.spec
          bash packaging/build-deb.sh
      - name: Smoke test installed package
        run: |
          package=$(find dist -maxdepth 1 -name 'macrorunner_*_amd64.deb' -print -quit)
          test -n "$package"
          sudo apt-get install -y "./$package"
          test -x /usr/bin/macro-runner
          test -f /usr/share/applications/macrorunner.desktop
          timeout 20s xvfb-run -a python -c 'import subprocess,time,os; p=subprocess.Popen(["/usr/bin/macro-runner"],env={**os.environ,"QT_QPA_PLATFORM":"xcb"}); time.sleep(4); assert p.poll() is None, "MacroRunner failed to start"; p.terminate(); p.wait(timeout=10)'
      - uses: actions/upload-artifact@v4
        with:
          name: macrorunner-ubuntu-amd64
          path: dist/macrorunner_*_amd64.deb
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install -e . pyinstaller
          choco install innosetup --yes --no-progress
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm MacroRunner.spec
          if (!(Test-Path dist/MacroRunner.exe)) { throw "Missing Windows executable" }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Get-ChildItem Output/MacroRunner-Setup-*.exe -ErrorAction SilentlyContinue)) { throw "Missing installer" }
      - uses: actions/upload-artifact@v4
        with:
          name: macrorunner-windows-x64
          path: Output/MacroRunner-Setup-*.exe
          if-no-files-found: error
