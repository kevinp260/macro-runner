name: Build desktop installers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and optional release tag
        shell: bash
        run: |
          python -m macro_version
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python -m macro_version --check-tag "$GITHUB_REF_NAME"
          fi

  ubuntu-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xvfb libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 scrot
          python -m pip install -e . pyinstaller
      - name: Run full tests for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Ubuntu installer
        run: |
          python -m PyInstaller --clean --noconfirm MacroRunner.spec
          bash packaging/build-deb.sh
      - name: Smoke test installed package
        run: |
          package=$(find dist -maxdepth 1 -name 'macrorunner_*_amd64.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Version)" = "$(python -m macro_version)"
          sudo apt-get install -y "./$package"
          test -x /usr/bin/macro-runner
          test -f /usr/share/applications/macrorunner.desktop
          timeout 20s xvfb-run -a python -c 'import subprocess,time,os; p=subprocess.Popen(["/usr/bin/macro-runner"],env={**os.environ,"QT_QPA_PLATFORM":"xcb"}); time.sleep(4); assert p.poll() is None, "MacroRunner failed to start"; p.terminate(); p.wait(timeout=10)'
      - uses: actions/upload-artifact@v4
        with:
          name: macrorunner-ubuntu-amd64
          path: dist/macrorunner_*_amd64.deb
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install -e . pyinstaller
          choco install innosetup --yes --no-progress
      - name: Run full tests for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm MacroRunner.spec
          if (!(Test-Path dist/MacroRunner.exe)) { throw "Missing Windows executable" }
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath (Resolve-Path dist/MacroRunner.exe) -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "MacroRunner exited unexpectedly: $($process.ExitCode)" }
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          $version = (& python -m macro_version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read project version" }
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path "Output/MacroRunner-Setup-$version.exe")) { throw "Missing versioned installer" }
      - uses: actions/upload-artifact@v4
        with:
          name: macrorunner-windows-x64
          path: Output/MacroRunner-Setup-*.exe
          if-no-files-found: error

  publish-release:
    name: Publish versioned installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, ubuntu-deb, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macrorunner-*
          path: release-assets
          merge-multiple: true
      - name: Verify both release installers
        shell: bash
        run: |
          version=$(python3 -m macro_version)
          test -f "release-assets/macrorunner_${version}_amd64.deb"
          test -f "release-assets/MacroRunner-Setup-${version}.exe"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -m macro_version)
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/macrorunner_${version}_amd64.deb" \
            "release-assets/MacroRunner-Setup-${version}.exe" \
            --title "MacroRunner v${version}" \
            --generate-notes --verify-tag
